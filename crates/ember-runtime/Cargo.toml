[package]
name = "ember-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
ember-core = { path = "../ember-core" }
ember-scene = { path = "../ember-scene" }
ember-lang = { path = "../ember-lang" }
ember-vm = { path = "../ember-vm" }
rapier2d = { version = "0.36", default-features = false, features = ["dim2", "f32", "std"] }

[dev-dependencies]
ember-renderer = { path = "../ember-renderer" }
pollster = "1"
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["png"] }
