[workspace]
members = [
    "crates/ember-cli",
    "crates/ember-core",
    "crates/ember-renderer",
    "crates/ember-scene",
    "crates/ember-project",
    "crates/ember-lang",
    "crates/ember-vm",
    "crates/ember-runtime",
    "crates/ember-player",
    "crates/ember-editor",
    "crates/ember-audio",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
